app_url = "http://localhost:5173"
bind_addr = "0.0.0.0:3000"
db_path = ".devenv/state/db-test/portail.db"

[directory]
backend = "sqlite"

[ldap]
url = "ldap://127.0.0.1:3891"
base_dn = "dc=test,dc=example,dc=com"
people_ou = "people"
groups_ou = "groups"

[oidc]
issuer_url = "http://127.0.0.1:3000"
client_id = "portail-dev"
redirect_uri = "http://localhost:5173/callback"
secrets_dir = ".devenv/state/secrets-test"
key_bits = 2048
secret_logs = false
clients = [
    { id = "portail-dev", secret_file = "portail-dev_secret", enabled = true, redirect_uris = [
        "http://localhost:5173/callback",
    ], scopes = [
        "openid",
        "profile",
        "email",
        "groups",
    ], custom_claims = [
        { name = "env", value = "test" },
        { name = "power", value = "admin-tools", group = "admin" },
        { name = "outsider", value = "yes", not_group = "admin" },
    ] },
    { id = "gated", enabled = true, redirect_uris = [
        "http://localhost:5173/callback",
    ], scopes = [
        "openid",
    ], required_group = "admin", forbidden_group = "banned" },
    { id = "blocked", enabled = true, redirect_uris = [
        "http://localhost:5173/callback",
    ], scopes = [
        "openid",
    ], forbidden_group = "banned" }
]

[security]
password_min_length = 2
login_max_attempts = 3
