# Edge TLS par SNI : portail.localhost -> SPA statique + /api et les endpoints
# du fournisseur OIDC (backend). Cert auto-signé (docker/gen-secrets.sh).
# Aucun autre port exposé : ldap/backend restent dans le réseau compose.

server {
  listen 443 ssl;
  http2 on;
  server_name portail.localhost;
  root /usr/share/nginx/html;

  ssl_certificate /etc/nginx/tls/portal.crt;
  ssl_certificate_key /etc/nginx/tls/portal.key;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /jwks.json {
    proxy_pass http://backend:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /.well-known/openid-configuration {
    proxy_pass http://backend:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location = /logout {
    proxy_pass http://backend:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
