# Edge TLS par SNI : authelia.localhost -> Authelia (login + issuer OIDC),
# portail.localhost -> SPA statique + /api -> backend. Cert auto-signé (docker/gen-secrets.sh).
# Aucun autre port exposé : ldap/authelia/backend restent dans le réseau compose.

server {
  listen 443 ssl;
  http2 on;
  server_name authelia.localhost;

  ssl_certificate /etc/nginx/tls/portal.crt;
  ssl_certificate_key /etc/nginx/tls/portal.key;

  location / {
    proxy_pass https://authelia:9091;
    proxy_ssl_verify off; # cert auto-signé interne
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name portail.localhost;
  root /usr/share/nginx/html;

  ssl_certificate /etc/nginx/tls/portal.crt;
  ssl_certificate_key /etc/nginx/tls/portal.key;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
