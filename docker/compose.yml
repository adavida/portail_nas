# Stack locale — tout se passe via compose : `up` construit les images absentes
# (sections `build:`), télécharge openldap s'il manque, et ne touche jamais aux
# volumes de données au rebuild.
# Prérequis (une fois, hors compose) :
#   bash docker/gen-secrets.sh                       # mdp admin LDAP + cert TLS
# Lancer (depuis la racine du repo) :
#   docker compose -f docker/compose.yml up -d                 # mode sqlite
#   docker compose -f docker/compose.yml --profile ldap up -d  # mode ldap
#   docker compose -f docker/compose.yml up -d --build         # forcer le rebuild (le `up`
#                                                              # simple ne reconstruit que si l'image manque)
# Entrée unique : le conteneur frontend fait edge TLS par SNI sur 443 —
#   https://portail.localhost (SPA + /api + fournisseur OIDC du backend).
# Deux modes d'annuaire, choisis par [directory] backend dans ./config.toml :
#   sqlite -> docker compose up -d                          (pas de conteneur LDAP)
#   ldap   -> docker compose --profile ldap up -d           (openldap + seed + schéma portailAttr)
# Données sauvegardées (volumes nommés, survivent aux `down` et aux rebuilds) :
#   ldap-data / ldap-config  -> annuaire OpenLDAP (users, groups, portailAttr)
#   backend-data             -> SQLite /data/portail.db (subs OIDC + attrs si backend sqlite)
#   oidc-secrets             -> clé de signature + secrets générés au premier start
# Config applicative : ./config.toml monté en lecture seule (--config), jamais de
# variable d'env de config ; ./secrets (mot de passe LDAP, cert TLS) monté en ro.
# ldap/backend ne publient aucun port (réseau interne compose uniquement).

services:
  openldap:
    image: docker.io/osixia/openldap:1.5.0
    profiles: ["ldap"]
    environment:
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-admin}
      LDAP_DOMAIN: dev.example.com
      LDAP_ORGANISATION: dev example
      LDAP_SEED_INTERNAL_SCHEMA_PATH: /container/slapd/schema
      LDAP_SEED_INTERNAL_LDIF_PATH: /container/slapd/ldif
    volumes:
      - ./portail.schema:/container/slapd/schema/portail.schema:ro
      - ./seed.ldif:/container/slapd/ldif/00-seed.ldif:ro
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d

  backend:
    image: portail-backend:dev
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    volumes:
      - ./config.toml:/etc/portail/config.toml:ro
      - ./secrets:/secrets:ro
      - backend-data:/data
      - oidc-secrets:/oidc-secrets
    restart: on-failure # en mode ldap, retente jusqu'à ce qu'openldap soit prêt (pas de depends_on : il forcerait le profil ldap)

  frontend:
    image: portail-frontend:dev
    build:
      context: ../frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports:
      - "443:443" # edge TLS SNI : portail.localhost -> SPA + /api + OIDC
    volumes:
      - ./secrets/portal.crt:/etc/nginx/tls/portal.crt:ro
      - ./secrets/portal.key:/etc/nginx/tls/portal.key:ro
    depends_on:
      - backend
    restart: on-failure # nginx résout "backend" au boot : laisse passer la course DNS compose

volumes:
  ldap-data:
  ldap-config:
  backend-data:
  oidc-secrets:
