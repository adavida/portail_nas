[package]
name = "portail-metrics"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[dependencies]
portail-core = { path = "../core" }
portail-units = { path = "../units" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
