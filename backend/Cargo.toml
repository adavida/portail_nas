[package]
name = "portail-backend"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ldap3 = { version = "0.12", default-features = false, features = ["tls-native"] }
native-tls = "0.2"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
sha2 = "0.11.1"
libc = "0.2"
exacl = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.7.1", features = ["trace"] }

[dev-dependencies]
ctor = "1.0.13"
dtor = "1"
tower = "0.5"
http-body-util = "0.1"

[features]
test-api = []
