[package]
name = "portail-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8.9"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ldap3 = { version = "0.12", default-features = false }

[dev-dependencies]
ctor = "1.0.13"
tower = "0.5"
http-body-util = "0.1"

[features]
test-api = []
