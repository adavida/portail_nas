[package]
name = "portail-oidc"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[dependencies]
portail-core = { path = "../core" }
portail-db = { path = "../db" }
portail-directory = { path = "../directory" }
axum = "0.8.9"
base64 = "0.23.1"
exacl = "0.13"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
libc = "0.2"
rand = "0.8"
rsa = { version = "0.9", features = ["pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tracing = "0.1"

[dev-dependencies]
ctor = "1.0.13"
http-body-util = "0.1"
tower = "0.5"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
test-api = []
