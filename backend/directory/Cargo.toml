[package]
name = "portail-directory"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[dependencies]
portail-core = { path = "../core" }
axum = "0.8.9"
ldap3 = { version = "0.12", default-features = false, features = ["tls-native"] }
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
ctor = "1.0.13"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[features]
test-api = []
